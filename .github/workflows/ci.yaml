name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What each chart needs from CI — the extra render flags, whether it can be installed on
# a cluster, what has to exist first — lives in `.github/ci/<chart>.env`, not here. This
# file names no chart. Adding one means adding a chart directory and nothing else.
env:
  # The declared floor and a current version. kindest/node images as old as 1.22 need a
  # kind release from the same era; if that entry stops booting on the runner image, drop
  # it and let the 1.22 kubeconform pass in `render` carry the floor on its own.
  K8S_VERSIONS: >-
    [{"k8s": "v1.22.17", "kind": "v0.20.0"},
     {"k8s": "v1.31.6",  "kind": "v0.27.0"}]

jobs:
  lint:
    name: ct lint
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list.outputs.changed }}
      charts: ${{ steps.list.outputs.charts }}
      install: ${{ steps.list.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ct diffs against the target branch, so it needs the history.
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      # Pinned, not "3.x": chart-testing builds its venv against whatever python is
      # on the runner, and ct 3.12.0's yamale still uses ast.Num, which python 3.14
      # removed. On 3.14 `ct lint` dies inside Chart.yaml schema validation.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      # Two lists come out of here: every chart to render, and the chart-by-cluster
      # combinations to install. A chart opts into the second one with INSTALL=true in
      # its .github/ci/<chart>.env; without it `ct install` would put the chart on a cluster with
      # default values and wait for a readiness it was never going to reach.
      - name: List changed charts
        id: list
        run: |
          set -euo pipefail
          charts=$(ct list-changed --config ct.yaml)
          if [ -z "$charts" ]; then
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d ! -name common)
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chart changed; validating all charts, skipping the install job."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          install='[]'
          for chart in $charts; do
            INSTALL=false
            CHART="$chart"
            # shellcheck disable=SC1090
            [ -f ".github/ci/$(basename "$chart").env" ] && . ".github/ci/$(basename "$chart").env"
            [ "$INSTALL" = true ] || continue
            install=$(jq -c --arg c "$chart" --argjson k "$K8S_VERSIONS" \
              '. + ($k | map({chart: $c} + .))' <<< "$install")
          done

          {
            echo "charts=$(printf '%s\n' $charts | jq -R . | jq -sc .)"
            echo "install=$install"
          } >> "$GITHUB_OUTPUT"
          echo "Charts: $charts"
          echo "Install: $install"

      # Also enforces the rule that a changed chart must come with a version bump.
      - name: ct lint
        run: ct lint --config ct.yaml

  render:
    name: render ${{ matrix.chart }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.lint.outputs.charts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      # A fresh checkout has no built dependencies — charts/mongodb-sharded/charts/common-*.tgz
      # is gitignored — and without them every `common.*` include fails, which looks like a
      # chart bug and is not one. This used to be carried by `ct lint` building them
      # earlier in the same job; the job split took that away.
      - name: Build chart dependencies
        run: helm dependency update "${{ matrix.chart }}"

      - name: Template unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
          if [ -d "${{ matrix.chart }}/tests" ]; then
            helm unittest "${{ matrix.chart }}"
          else
            echo "skip ${{ matrix.chart }}: no tests/"
          fi

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/

      # Renders the chart and validates the result against the real API schemas, at the
      # declared floor and at a current version. CRD schemas (ServiceMonitor and friends)
      # come from the datree catalog; anything with no schema is skipped rather than
      # failed. The images are printed so a tag that was never built in
      # shepherd44/containers shows up in the log instead of at install time.
      #
      # RENDER_ARGS comes from the chart, not from here, because `--set` on a key a chart
      # does not have is accepted silently: one chart's flags on another render plain
      # defaults and exit zero, which reads exactly like a passing check.
      - name: Render, validate and list images
        run: |
          set -euo pipefail
          CHART="${{ matrix.chart }}"
          RENDER_ARGS=()
          # shellcheck disable=SC1090
          [ -f ".github/ci/$(basename "$CHART").env" ] && . ".github/ci/$(basename "$CHART").env"

          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for kube in 1.22.0 1.31.0; do
            echo "== $CHART @ $kube"
            helm template ci-test "$CHART" "${RENDER_ARGS[@]}" --kube-version "$kube" \
              | kubeconform -strict -summary \
                  -kubernetes-version "$kube" \
                  -schema-location default \
                  -schema-location "$crds" \
                  -ignore-missing-schemas
          done

          echo "== $CHART images"
          helm template ci-test "$CHART" "${RENDER_ARGS[@]}" | grep -E '^[[:space:]]+image:' | sort -u

          # annotations.images is a gate, not documentation: the bundled common library
          # compares it against every rendered image. Fail when it drifts.
          python3 hack/check-image-annotations.py "$CHART" "${RENDER_ARGS[@]}"

  helm4:
    name: helm 4 render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2
      # Helm 4 uses server-side apply on install, which this job does not exercise —
      # it only proves the charts still lint and render under the v4 client, since
      # v3 is what the ct jobs run.
      - name: Lint, render and unit test with Helm 4
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          for chart in $(find charts -mindepth 1 -maxdepth 1 -type d ! -name common); do
            helm dependency update "$chart" >/dev/null
            helm lint "$chart"
            helm template ci-test "$chart" >/dev/null
            if [ -d "$chart/tests" ]; then helm unittest "$chart"; fi
          done

  install:
    name: install ${{ matrix.chart }} on kind (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: lint
    # Skipped when no chart changed, since there is nothing new to install — except on a
    # manual run, which is the only way to exercise this job from a branch that touches
    # CI and no chart.
    if: >-
      needs.lint.outputs.install != '[]' &&
      (needs.lint.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lint.outputs.install) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned, not "3.x": chart-testing builds its venv against whatever python is
      # on the runner, and ct 3.12.0's yamale still uses ast.Num, which python 3.14
      # removed. On 3.14 `ct lint` dies inside Chart.yaml schema validation.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      - uses: helm/kind-action@v1
        with:
          version: ${{ matrix.kind }}
          node_image: kindest/node:${{ matrix.k8s }}
          cluster_name: ct

      # Whatever has to exist on the cluster before the chart has any chance of coming
      # up — cp-schema-registry cannot reach readiness without a Kafka holding the
      # _schemas topic. A chart that needs nothing declares nothing.
      - name: Deploy the chart's fixtures
        run: |
          set -euo pipefail
          CHART="${{ matrix.chart }}"
          FIXTURES=()
          FIXTURE_WAIT=()
          # shellcheck disable=SC1090
          [ -f ".github/ci/$(basename "$CHART").env" ] && . ".github/ci/$(basename "$CHART").env"
          if [ ${#FIXTURES[@]} -eq 0 ]; then
            echo "no fixtures for $CHART"
            exit 0
          fi
          for f in "${FIXTURES[@]}"; do kubectl apply -f "$f"; done
          if [ ${#FIXTURE_WAIT[@]} -gt 0 ]; then kubectl "${FIXTURE_WAIT[@]}"; fi

      # Installs each ci/*-values.yaml, waits for readiness, then runs `helm test`.
      - name: ct install
        run: ct install --config ct.yaml --charts "${{ matrix.chart }}"
