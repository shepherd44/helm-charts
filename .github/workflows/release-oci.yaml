name: release-oci

# Fires on a release tag and pushes the same chart a second way: as an OCI
# artifact in GitHub Container Registry, signed with keyless cosign.
#
# docs/ is unaffected and stays the primary channel. What this adds is content
# addressing -- a registry artifact cannot be repackaged under the same digest,
# so the repo's immutability rule becomes a property instead of a discipline --
# and a signature anyone can verify without a key to distribute.
on:
  push:
    tags:
      - "*-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. cp-schema-registry-1.2.0
        required: true

permissions:
  contents: read
  packages: write
  # Keyless signing: the identity in the certificate is this workflow, proven by
  # the OIDC token. There is no private key anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - uses: sigstore/cosign-installer@v3

      # cp-schema-registry-1.2.0 -> chart cp-schema-registry, version 1.2.0
      - name: Read the tag
        id: tag
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          version="${tag##*-}"
          chart="${tag%-$version}"
          if [ ! -d "charts/$chart" ]; then
            echo "no chart directory for tag $tag (looked for charts/$chart)" >&2
            exit 1
          fi
          got=$(awk '/^version:/{print $2; exit}' "charts/$chart/Chart.yaml")
          if [ "$got" != "$version" ]; then
            echo "tag says $version, charts/$chart/Chart.yaml says $got" >&2
            exit 1
          fi
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Up to cp-schema-registry 1.3.0 this pushed the tarball committed in docs/, so
      # the two channels were byte-identical. docs/ is frozen now — nothing new is
      # added there — so the registry artifact is the only one and is built here.
      # A version still in docs/ is pushed from that file rather than rebuilt, since
      # `helm package` embeds a timestamp and would otherwise change the digest of
      # something already published.
      - name: Package
        id: pkg
        run: |
          published="docs/${{ steps.tag.outputs.chart }}-${{ steps.tag.outputs.version }}.tgz"
          if [ -f "$published" ]; then
            echo "already in the frozen docs/ repo, pushing that file unchanged"
            sha256sum "$published"
            echo "path=$published" >> "$GITHUB_OUTPUT"
          else
            helm dependency update "charts/${{ steps.tag.outputs.chart }}"
            helm package "charts/${{ steps.tag.outputs.chart }}" --destination /tmp/pkg
            tgz="/tmp/pkg/${{ steps.tag.outputs.chart }}-${{ steps.tag.outputs.version }}.tgz"
            sha256sum "$tgz"
            echo "path=$tgz" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to ghcr.io
        id: push
        env:
          # Lowercased: registry paths are case-sensitive and the owner is not.
          OWNER: ${{ github.repository_owner }}
        run: |
          # Two logins, on purpose: helm keeps its credentials in its own config and
          # cosign reads ~/.docker/config.json. Without the docker login the push
          # succeeds and the signature upload comes back UNAUTHORIZED.
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/charts"
          # helm push prints Pushed:/Digest: on stderr, not stdout, so the
          # redirect is load-bearing: without it the log is empty and the digest
          # comes out blank.
          helm push "${{ steps.pkg.outputs.path }}" "oci://$repo" 2>&1 | tee /tmp/push.log
          digest=$(awk '/^Digest: /{print $2}' /tmp/push.log)
          if [ -z "$digest" ]; then
            echo "helm push reported no digest; refusing to sign a guessed reference" >&2
            exit 1
          fi
          echo "ref=$repo/${{ steps.tag.outputs.chart }}@$digest" >> "$GITHUB_OUTPUT"

      # Signs the artifact by digest, not by tag: a tag can be moved, a digest
      # cannot. --yes skips the confirmation prompt for the transparency log.
      - name: Sign
        run: cosign sign --yes '${{ steps.push.outputs.ref }}'

      - name: Verify what was just published
        run: |
          cosign verify '${{ steps.push.outputs.ref }}' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            > /dev/null
          echo "published and verified: ${{ steps.push.outputs.ref }}"
