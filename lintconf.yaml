# yamllint rules for `ct lint`. Deliberately permissive: this repo's values.yaml
# files carry long explanatory comments and copied upstream blocks, and none of
# that is worth failing a chart over. Only things that change meaning are errors.
rules:
  braces:
    level: error
    min-spaces-inside: 0
    max-spaces-inside: 0
  brackets:
    level: error
    min-spaces-inside: 0
    max-spaces-inside: 0
  colons:
    level: error
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    level: error
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  comments: disable
  comments-indentation: disable
  document-start: disable
  empty-lines:
    level: error
    max: 2
    max-start: 0
    max-end: 1
  hyphens:
    level: error
    max-spaces-after: 1
  indentation:
    level: error
    spaces: consistent
    indent-sequences: whatever
  key-duplicates: enable
  line-length: disable
  new-line-at-end-of-file: enable
  new-lines:
    type: unix
  trailing-spaces: enable
  truthy: disable
