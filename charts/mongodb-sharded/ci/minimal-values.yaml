# ct install: the smallest sharded topology that is still sharded.
#
# One shard instead of two and no persistence, because the point here is that the
# chart's objects come up and talk to each other, not that MongoDB survives a
# restart. Two shards doubles the pods for no extra coverage, and PVCs on a KinD
# node only add teardown time.
shards: 1

# Explicit resources, not a preset. `nano` caps memory at 192Mi and MongoDB 8 is
# OOMKilled on startup there, which shows up as a config server crash-looping and
# every other pod reporting ECONNREFUSED against it. 512Mi is enough to come up;
# three pods at that request still fit a runner.

auth:
  rootPassword: ct-install-not-a-real-password

configsvr:
  replicaCount: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

shardsvr:
  persistence:
    enabled: false
  dataNode:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

mongos:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
