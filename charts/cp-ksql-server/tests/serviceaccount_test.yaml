suite: service account and disruption budget
release:
  name: t
tests:
  - it: creates a ServiceAccount named after the release and uses it
    templates:
      - serviceaccount.yaml
      - deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: names the ServiceAccount on the pod
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: t-cp-ksql-server
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: uses an existing ServiceAccount without creating one
    templates:
      - serviceaccount.yaml
    set:
      serviceAccount:
        create: false
        name: existing
    asserts:
      - hasDocuments:
          count: 0

  - it: falls back to default only when told not to create and given no name
    templates:
      - deployment.yaml
    set:
      serviceAccount:
        create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  # With one replica a budget of minAvailable 1 blocks node drains outright, so it is
  # off until someone runs more than one.
  - it: renders no PodDisruptionBudget by default
    templates:
      - poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: selects the same pods as the Deployment when enabled
    templates:
      - poddisruptionbudget.yaml
    set:
      replicaCount: 2
      podDisruptionBudget.enabled: true
    asserts:
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app: cp-ksql-server
            release: t
