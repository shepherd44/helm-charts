suite: deployment
templates:
  - deployment.yaml
release:
  name: t
tests:
  - it: names itself after the release and the chart
    asserts:
      - equal:
          path: metadata.name
          value: t-cp-ksql-server
      - equal:
          path: spec.selector.matchLabels
          value:
            app: cp-ksql-server
            release: t

  - it: runs the Confluent image on the pinned appVersion
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: cp-ksql-server
      - equal:
          path: spec.template.spec.containers[0].image
          value: confluentinc/cp-ksqldb-server:7.9.9

  # Nothing points these at a real Kafka or Schema Registry by default, so the chart
  # guesses at sibling releases of the (long gone) cp-kafka and cp-schema-registry
  # charts. Anyone installing this has to set both.
  - it: falls back to sibling cp-helm-charts release names
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_BOOTSTRAP_SERVERS
            value: PLAINTEXT://t-cp-kafka-headless:9092
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_SCHEMA_REGISTRY_URL
            value: http://t-cp-schema-registry:8081

  - it: uses the given Kafka and Schema Registry when they are set
    set:
      kafka.bootstrapServers: kafka-cluster-kafka-bootstrap:9092
      cp-schema-registry.url: http://cp-schema-registry:8081
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_BOOTSTRAP_SERVERS
            value: kafka-cluster-kafka-bootstrap:9092
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_SCHEMA_REGISTRY_URL
            value: http://cp-schema-registry:8081

  # The service id names every internal topic ksqlDB creates
  # (_confluent-ksql-<serviceId>_command_topic and the query state stores), so changing
  # it on a running deployment orphans all of them.
  - it: takes the service id from values
    set:
      serviceId: ksqldb-dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_SERVICE_ID
            value: ksqldb-dev

  - it: serves the REST API and sets the topic replication factors by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_LISTENERS
            value: http://0.0.0.0:8088
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_INTERNAL_TOPIC_REPLICAS
            value: "3"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_QUERIES_FILE
            value: /etc/ksql/queries/queries.sql

  - it: mounts the queries file and stops serving the REST API in headless mode
    set:
      ksql.headless: true
      ksql.queries: "CREATE STREAM s (id INT) WITH (kafka_topic='t', value_format='JSON');"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_QUERIES_FILE
            value: /etc/ksql/queries/queries.sql
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ksql-queries
            mountPath: /etc/ksql/queries
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_LISTENERS
            value: http://0.0.0.0:8088

  # A dotted config key becomes an upper-case underscored variable with a KSQL_ prefix,
  # which is how the Confluent image turns environment into ksql-server.properties.
  - it: turns configurationOverrides into KSQL_ environment variables
    set:
      configurationOverrides:
        ksql.streams.producer.retries: "2147483647"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KSQL_KSQL_STREAMS_PRODUCER_RETRIES
            value: "2147483647"

  - it: ships the JMX exporter sidecar and the scrape annotations by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: prometheus-jmx-exporter
      - equal:
          path: spec.template.spec.containers[1].image
          value: shepherd9664/jmx-exporter:1.6.0-latest
      # The image entrypoint is the jar, so only args are passed. The command this
      # replaced carried JVM flags JDK 11 removed.
      - isNull:
          path: spec.template.spec.containers[1].command
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - "5556"
            - /etc/jmx-ksql-server/jmx-ksql-server-prometheus.yml
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "5556"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JMX_PORT
            value: "5555"

  - it: drops the sidecar, its volume and the annotations when metrics are off
    set:
      prometheus.jmx.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - isNull:
          path: spec.template.metadata.annotations
      - isNull:
          path: spec.template.spec.volumes

  # /healthcheck is not usable: every ksqlDB pod in both k8s-idc namespaces reports
  # commandRunner unhealthy while running its queries fine, so a probe on it would take
  # a working fleet out of service.
  - it: probes /info on the REST port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /info
            port: server
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /info
            port: server
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30

  - it: drops a probe that is unset
    set:
      livenessProbe: null
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe

  # A Service named `ksql` in the same namespace would otherwise arrive as KSQL_PORT,
  # which the Confluent image reads as configuration and refuses to start on.
  - it: turns Kubernetes service links off
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: runs as uid 1000 with a hardened container context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: appends extraEnv after the config-derived variables
    set:
      extraEnv:
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: -XX:MaxRAMPercentage=75

  - it: takes env from a Secret without spelling it into the Deployment
    set:
      envFrom:
        - secretRef:
            name: ksql-kafka-credentials
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: ksql-kafka-credentials

  - it: mounts extra volumes on the server container
    set:
      extraVolumes:
        - name: truststore
          secret:
            secretName: kafka-truststore
      extraVolumeMounts:
        - name: truststore
          mountPath: /etc/ksql/secrets
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: truststore
            secret:
              secretName: kafka-truststore
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: truststore
            mountPath: /etc/ksql/secrets
            readOnly: true

  - it: carries scheduling constraints through
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cp-ksql-server
      priorityClassName: high
      strategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.priorityClassName
          value: high
      - equal:
          path: spec.strategy.type
          value: Recreate
