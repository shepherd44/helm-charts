suite: configmaps
release:
  name: t
tests:
  - it: writes a JMX exporter config naming the ksqlDB query stats bean
    templates:
      - jmx-configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: t-cp-ksql-server-jmx-configmap
      - matchRegex:
          path: data["jmx-ksql-server-prometheus.yml"]
          pattern: io\.confluent\.ksql\.metrics:type=ksql-engine-query-stats
      - matchRegex:
          path: data["jmx-ksql-server-prometheus.yml"]
          pattern: rmi://localhost:5555/jmxrmi

  - it: drops the JMX config when the exporter is off
    templates:
      - jmx-configmap.yaml
    set:
      prometheus.jmx.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no queries ConfigMap outside headless mode
    templates:
      - ksql-queries-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: writes the queries from values in headless mode
    templates:
      - ksql-queries-configmap.yaml
    set:
      ksql.headless: true
      ksql.queries: |
        CREATE STREAM s (id INT) WITH (kafka_topic='t', value_format='JSON');
    asserts:
      - equal:
          path: metadata.name
          value: t-cp-ksql-server-ksql-queries-configmap
      - matchRegex:
          path: data["queries.sql"]
          pattern: CREATE STREAM s \(id INT\)

  # A headless server runs only what is in this file, so an empty one starts, does
  # nothing, and reports itself healthy.
  - it: refuses to render a headless server with no queries
    templates:
      - ksql-queries-configmap.yaml
    set:
      ksql.headless: true
    asserts:
      - failedTemplate:
          errorMessage: "ksql.queries is required when ksql.headless is true"
