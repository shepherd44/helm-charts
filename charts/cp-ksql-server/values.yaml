# Default values for cp-ksql-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

serviceId: "cp-ksql-server"

## Image Info
## ref: https://hub.docker.com/r/confluentinc/cp-ksql-server/
image: confluentinc/cp-ksqldb-server
imageTag: 7.9.9

## Specify a imagePullPolicy
## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
imagePullPolicy: IfNotPresent

## Specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
imagePullSecrets:

servicePort: 8088

## KSQL JVM Heap Option
heapOptions: "-Xms512M -Xmx512M"

## Kubernetes publishes a <SERVICE>_PORT style variable into every pod for every Service
## in the namespace, and the Confluent image reads KSQL_* out of the environment as
## configuration. A Service named `ksql` next door becomes KSQL_PORT=tcp://10.0.0.1:8088
## and the server exits on startup complaining about a deprecated setting. Nothing here
## needs the links.
enableServiceLinks: false

## Probes. Set either to {} to omit it.
##
## /info, not /healthcheck. /healthcheck reports `commandRunner.isHealthy: false` on
## servers that are running their queries perfectly well — every ksqlDB pod in both
## k8s-idc namespaces answers that way right now — so a probe reading it would take a
## healthy fleet out of service. /info answers 200 once the REST layer is listening,
## which is what a probe can actually tell you here.
##
## The initial delays are generous on purpose: a server with persistent queries replays
## its command topic and rebuilds RocksDB state before it serves, and that is minutes,
## not seconds, on a large state store.
livenessProbe:
  httpGet:
    path: /info
    port: server
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /info
    port: server
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## Custom pod annotations
podAnnotations: {}

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

## Monitoring
## JMX Settings
## ref: https://docs.confluent.io/current/ksql/docs/operations.html
jmx:
  port: 5555

## Prometheus Exporter Configuration
## ref: https://prometheus.io/docs/instrumenting/exporters/
prometheus:
  ## JMX Exporter Configuration
  ## ref: https://github.com/prometheus/jmx_exporter
  jmx:
    enabled: true
    image: solsson/kafka-prometheus-jmx-exporter@sha256
    imageTag: 6f82e2b0464f50da8104acd7363fb9b995001ddff77d248379f8788e78946143
    imagePullPolicy: IfNotPresent
    port: 5556

    ## Resources configuration for the JMX exporter container.
    ## See the `resources` documentation above for details.
    resources: {}

## External Access
## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
external:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  port: 8088

## Headless mode
## ref: https://docs.confluent.io/current/ksql/docs/installation/server-config/index.html
##
## Off by default, which is the other way round from upstream. Interactive is how ksqlDB
## is normally run — it is what both k8s-idc deployments use — and upstream's default of
## headless came with a queries file holding the pageviews/users walkthrough, so the
## out-of-the-box behaviour was to run a tutorial against topics that do not exist.
ksql:
  headless: false

  ## The queries a headless server runs, mounted at /etc/ksql/queries/queries.sql.
  ## Required when headless is on and ignored otherwise. This used to be a queries.sql
  ## file inside the chart, which meant changing it meant forking the chart.
  queries: ""

  ## Only read in interactive mode; a headless server takes these from its queries.
  sinkReplicas: "3"
  streamsReplicationFactor: "3"
  internalTopicReplicas: "3"

## You can list load balanced service endpoint, or list of all brokers (which is hard in K8s).  e.g.:
## bootstrapServers: "PLAINTEXT://dozing-prawn-kafka-headless:9092"
kafka:
  bootstrapServers: ""

## e.g. http://gnoble-panther-cp-schema-registry:8081
cp-schema-registry:
  url: ""

# KSQL configuration options
## ref: https://docs.confluent.io/current/ksql/docs/installation/server-config/config-reference.html
configurationOverrides: {}
  # "ksql.streams.producer.retries": "2147483647"

## `helm test`. Runs one curl against /info and fails on any non-2xx.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.11.1
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## Numeric on purpose: the image's own user is the name `curl_user`, and a pod with
  ## runAsNonRoot and a non-numeric user is rejected by the kubelet before it starts.
  securityContext:
    runAsUser: 100
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
