# Default values for cp-ksql-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

## The ksqlDB service id. It names every internal topic the server owns —
## _confluent-ksql-<serviceId>_command_topic and the state store topics behind each
## persistent query — so changing it on a running deployment orphans all of them and
## starts again from an empty state.
serviceId: "cp-ksql-server"

## Image Info
## ref: https://hub.docker.com/r/confluentinc/cp-ksqldb-server/
image:
  repository: confluentinc/cp-ksqldb-server
  tag: 7.9.9
  pullPolicy: IfNotPresent
  ## Secrets must already exist in the namespace.
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  pullSecrets: []

service:
  port: 8088
  labels: {}
  annotations: {}

## KSQL JVM Heap Option
##
## Only the heap. A ksqlDB server with persistent queries holds most of its memory
## off-heap in RocksDB, and that grows with the key space of the tables it maintains —
## the k8s-idc production servers sit around 2.2Gi of working set against a 512M heap,
## still climbing after ten months. Size `resources.limits.memory` from measurement,
## not from this number.
heapOptions: "-Xms512M -Xmx512M"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  memory: 4Gi
  # requests:
  #  cpu: 200m
  #  memory: 2Gi

## Kubernetes publishes a <SERVICE>_PORT style variable into every pod for every Service
## in the namespace, and the Confluent image reads KSQL_* out of the environment as
## configuration. A Service named `ksql` next door becomes KSQL_PORT=tcp://10.0.0.1:8088
## and the server exits on startup complaining about a deprecated setting. Nothing here
## needs the links.
enableServiceLinks: false

## Probes. Set either to {} to omit it.
##
## /info, not /healthcheck. /healthcheck reports `commandRunner.isHealthy: false` on
## servers that are running their queries perfectly well — every ksqlDB pod in both
## k8s-idc namespaces answers that way right now — so a probe reading it would take a
## healthy fleet out of service. /info answers 200 once the REST layer is listening,
## which is what a probe can actually tell you here.
##
## The initial delays are generous on purpose: a server with persistent queries replays
## its command topic and rebuilds RocksDB state before it serves, and that is minutes,
## not seconds, on a large state store.
livenessProbe:
  httpGet:
    path: /info
    port: server
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /info
    port: server
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

## Labels and annotations added to every object the chart creates. Per-resource blocks
## (service.labels, serviceAccount.annotations, and so on) are merged over these and win.
commonLabels: {}
commonAnnotations: {}

## Labels and annotations on the pod only.
podLabels: {}
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false

## Pod-level security context. The Confluent image's own user is appuser, uid 1000.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

## Container-level security context for the ksqlDB container.
## readOnlyRootFilesystem is deliberately not set: the image writes its generated
## configuration under the container filesystem, and Kafka Streams keeps its RocksDB
## state directory under /tmp.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

## Disabled by default: with replicaCount 1 a budget of minAvailable 1 blocks node
## drains outright. Enable it alongside replicaCount >= 2.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""
  labels: {}
  annotations: {}

## Deployment update strategy. Unset means the Kubernetes default rolling update.
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxUnavailable: 0
  #   maxSurge: 1

## Additional environment variables on the ksqlDB container, rendered as written.
## Anything the image should read as configuration is better set through
## configurationOverrides, which applies the KSQL_ prefix and the name mangling.
extraEnv: []
  # - name: JAVA_TOOL_OPTIONS
  #   value: -XX:MaxRAMPercentage=75

## Env from existing Secrets or ConfigMaps. Use this for anything sensitive — SASL JAAS
## configuration, truststore and keystore passwords — because configurationOverrides
## renders its values literally into the Deployment, where `kubectl get deploy -o yaml`
## and every GitOps diff can read them. Keys must already be spelled the way the image
## expects, e.g. KSQL_KSQL_STREAMS_SASL_JAAS_CONFIG.
envFrom: []
  # - secretRef:
  #     name: ksql-kafka-credentials

## Extra volumes and mounts on the ksqlDB container. A JKS truststore or keystore comes
## in this way.
extraVolumes: []
extraVolumeMounts: []

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

## Spread replicas across nodes or zones. Available since Kubernetes 1.19, so it is
## within this chart's 1.22 floor.
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app: cp-ksql-server

priorityClassName: ""

## Time to finish in-flight requests during a rolling update. Unset means the
## Kubernetes default of 30s.
terminationGracePeriodSeconds: null

## Monitoring
## JMX Settings
## ref: https://docs.confluent.io/current/ksql/docs/operations.html
jmx:
  port: 5555

## Prometheus JMX exporter sidecar.
## ref: https://github.com/prometheus/jmx_exporter
##
## On by default, unlike cp-schema-registry, because both live deployments run it and
## turning it off here would silently drop their metrics on the first upgrade.
metrics:
  enabled: true
  port: 5556

  ## Built from https://github.com/shepherd44/containers (jmx_prometheus_standalone).
  ## The image's entrypoint is the jar, so the deployment passes only args.
  ## Swapping this for another image means matching that contract.
  ##
  ## This replaced solsson/kafka-prometheus-jmx-exporter, which was last built in 2018,
  ## pinned by digest, and only worked because it was still JDK 8: the command it was
  ## launched with passed -XX:+UseCGroupMemoryLimitForHeap and -XX:MaxRAMFraction=1,
  ## both removed in JDK 11.
  image:
    repository: shepherd9664/jmx-exporter
    tag: 1.6.0-latest
    pullPolicy: IfNotPresent

  ## Resources configuration for the JMX exporter container.
  resources: {}

  ## The image's own user.
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true

  ## prometheus.io/scrape and prometheus.io/port on the pod. These only work for a
  ## Prometheus configured with kubernetes_sd_configs and relabeling; an Operator
  ## install ignores them and reads the CRDs below instead — which is why the exporter
  ## in both k8s-idc namespaces has been scraped by nothing for two years. Left on so
  ## an annotation-based setup keeps working; turn it off when using serviceMonitor or
  ## podMonitor, so the same target is not also discovered by annotation.
  scrapeAnnotations: true

  ## ServiceMonitor for the Prometheus Operator. Scrapes the exporter port through the
  ## chart's Service, which is the usual choice: it follows the endpoints, so it
  ## survives replica changes.
  ##
  ## `labels` almost always has to carry whatever the Prometheus resource selects on —
  ## with kube-prometheus-stack that is `release: <stack release name>`. Without it the
  ## object is created and quietly never scraped.
  ##
  ## Requires `metrics.enabled`: there is nothing listening otherwise, and the chart
  ## fails rather than rendering a monitor pointed at a port that does not exist.
  serviceMonitor:
    enabled: false
    ## Defaults to the release namespace.
    namespace: ""
    labels: {}
    annotations: {}
    jobLabel: ""
    ## Empty means the Prometheus global default.
    interval: ""
    scrapeTimeout: ""
    path: /metrics
    scheme: http
    honorLabels: false
    ## Extra matchLabels, ANDed with the chart's own selector.
    selector: {}
    relabelings: []
    metricRelabelings: []

  ## PodMonitor. The alternative to serviceMonitor, for scraping pods directly rather
  ## than through the Service. Enabling both is an error — the same target would be
  ## scraped twice under two job names.
  podMonitor:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    jobLabel: ""
    interval: ""
    scrapeTimeout: ""
    path: /metrics
    scheme: http
    honorLabels: false
    selector: {}
    relabelings: []
    metricRelabelings: []

  ## PrometheusRule. No rules are shipped: what is worth alerting on depends on the
  ## deployment, and a chart that ships opinionated alerts tends to ship noise.
  ## `rules` goes into a single group named after the release.
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    rules: []
      # - alert: KsqlServerDown
      #   expr: up{job="my-release-cp-ksql-server"} == 0
      #   for: 5m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: ksqlDB server is not being scraped

## Ingress for the ksqlDB REST API (service.port).
## `name` defaults to the chart fullname; set it to adopt an Ingress that already
## exists under a different name.
##
## The REST API has no authentication of its own. An Ingress puts a database you can
## issue arbitrary DDL against on the network you point it at — the two k8s-idc
## deployments are reached through an in-cluster UI instead, and neither has one.
ingress:
  enabled: false
  name: ""
  className: ""
  labels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts: []
    # - host: ksqldb.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: ksqldb-tls
    #   hosts:
    #     - ksqldb.example.com

## HTTPRoute, for clusters running a Gateway API controller. Independent of `ingress`
## above rather than an either/or switch: during a migration people genuinely run both,
## and independent flags mean retiring one later is not a breaking change.
##
## Needs the Gateway API CRDs installed (v1 needs Kubernetes >= 1.25) and a controller
## that implements them. The chart renders the object anywhere — nothing is auto-detected,
## because rendering must not depend on which cluster the client happens to point at.
##
## `parentRefs` is required: an HTTPRoute with no parent attaches to no Gateway and
## silently routes nothing, so the chart fails instead.
httpRoute:
  enabled: false
  name: ""
  labels: {}
  annotations: {}
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  hostnames: []
    # - ksqldb.example.com
  ## Left empty, the chart routes every path to its own Service. Set this to take
  ## over completely — matches, filters, timeouts, weighted backends.
  rules: []

## External Access
## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
external:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  port: 8088
  labels: {}
  annotations: {}
  loadBalancerSourceRanges: []

## Headless mode
## ref: https://docs.confluent.io/current/ksql/docs/installation/server-config/index.html
##
## Off by default, which is the other way round from upstream. Interactive is how ksqlDB
## is normally run — it is what both k8s-idc deployments use — and upstream's default of
## headless came with a queries file holding the pageviews/users walkthrough, so the
## out-of-the-box behaviour was to run a tutorial against topics that do not exist.
ksql:
  headless: false

  ## The queries a headless server runs, mounted at /etc/ksql/queries/queries.sql.
  ## Required when headless is on and ignored otherwise. This used to be a queries.sql
  ## file inside the chart, which meant changing it meant forking the chart.
  queries: ""

  ## Only read in interactive mode; a headless server takes these from its queries.
  sinkReplicas: "3"
  streamsReplicationFactor: "3"
  internalTopicReplicas: "3"

## You can list a load balanced service endpoint, or a list of all brokers. e.g.:
## bootstrapServers: "PLAINTEXT://dozing-prawn-kafka-headless:9092"
kafka:
  bootstrapServers: ""

## Schema Registry, needed by any query using Avro, Protobuf or JSON Schema.
## e.g. url: http://cp-schema-registry:8081
schemaRegistry:
  url: ""
  ## Only used to guess a sibling release's Service name when url is empty.
  nameOverride: ""

# KSQL configuration options
## ref: https://docs.confluent.io/current/ksql/docs/installation/server-config/config-reference.html
configurationOverrides: {}
  # "ksql.streams.producer.retries": "2147483647"

## `helm test`. Runs one curl against /info and fails on any non-2xx.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.11.1
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## Numeric on purpose: the image's own user is the name `curl_user`, and a pod with
  ## runAsNonRoot and a non-numeric user is rejected by the kubelet before it starts.
  securityContext:
    runAsUser: 100
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
