apiVersion: v2
name: cp-ksql-server
description: A Helm chart for Confluent ksqlDB Server on Kubernetes
type: application

## The floor is what the chart actually needs, not what upstream Kubernetes still
## supports: 1.22 went EOL in October 2022 and is kept here deliberately for legacy
## clusters. Everything the chart emits exists in 1.22 — apps/v1 Deployment, v1 Service,
## v1 ConfigMap, nothing else. The -0 suffix makes pre-release cluster versions such as
## 1.22.0-alpha.3 compare correctly instead of sorting below 1.22.0.
kubeVersion: ">=1.22.0-0"

## 1.0.0, not 0.1.2. Upstream's numbering stopped when confluentinc archived the
## repository; 0.1.1 was a local bump made in k8s-manifests and never published anywhere.
## This is the first version in this repository's line for the chart.
version: 1.4.0
appVersion: "7.9.9"
keywords:
  - kafka
  - ksql
  - ksqldb
  - confluent
home: https://github.com/shepherd44/helm-charts/tree/main/charts/cp-ksql-server
sources:
  - https://github.com/shepherd44/helm-charts/tree/main/charts/cp-ksql-server
maintainers:
  - name: shepherd44
    url: https://github.com/shepherd44

## Read by Artifact Hub and by anything else that indexes charts, and checked in CI by
## hack/check-image-annotations.py against what the chart actually renders.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: cp-ksqldb-server
      image: confluentinc/cp-ksqldb-server:7.9.9
    - name: jmx-exporter
      image: shepherd9664/jmx-exporter:1.6.0-latest
    - name: test-connection
      image: curlimages/curl:8.11.1
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/shepherd44/helm-charts/tree/main/charts/cp-ksql-server
  artifacthub.io/changes: |
    - kind: fixed
      description: "The JMX rules match a bean that exists. The inherited config looked for type=ksql-engine-query-stats, which ksqlDB has never registered, so the exporter had only ever served its own four metrics"
    - kind: fixed
      description: "ksql.advertised.listener is set to the pod IP, so the servers can reach each other; ksqlDB otherwise advertises a Deployment pod's hostname, which is not in DNS"
    - kind: changed
      description: "The probe rationale in values.yaml and the README described /healthcheck as permanently unhealthy; it was stale state that cleared on restart"
