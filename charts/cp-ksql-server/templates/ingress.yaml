{{- $v := include "cp-ksql-server.values" . | fromYaml -}}
{{- if $v.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $v.ingress.name | default (include "cp-ksql-server.fullname" .) }}
  labels:
{{ include "cp-ksql-server.mergedLabels" (list . $v.ingress.labels) | indent 4 }}
  {{- with (include "cp-ksql-server.mergedAnnotations" (list . $v.ingress.annotations)) }}
  annotations:
{{ . | indent 4 }}
  {{- end }}
spec:
  {{- with $v.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $v.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
  {{- range $v.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "cp-ksql-server.fullname" $ }}
                port:
                  number: {{ $v.service.port }}
        {{- end }}
  {{- end }}
{{- end }}
