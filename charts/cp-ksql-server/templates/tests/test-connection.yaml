{{- $v := include "cp-ksql-server.values" . | fromYaml -}}
{{- if $v.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ template "cp-ksql-server.fullname" . }}-test-connection
  {{- /* Deliberately not `app: <name>`: the Service selects on app plus release, and a
  test pod carrying those labels becomes one of its own endpoints the moment it is
  Running. With one replica the curl can then be routed to the test pod itself. */}}
  labels:
{{ include "cp-ksql-server.mergedLabels" (list . (dict "app" (printf "%s-test-connection" (include "cp-ksql-server.name" .)))) | indent 4 }}
  annotations:
  {{- with (include "cp-ksql-server.mergedAnnotations" (list . dict)) }}
{{ . | indent 4 }}
  {{- end }}
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with $v.tests.image.pullSecrets }}
  imagePullSecrets:
{{ toYaml . | indent 4 }}
  {{- end }}
  containers:
    - name: test-connection
      image: "{{ $v.tests.image.repository }}:{{ $v.tests.image.tag }}"
      imagePullPolicy: "{{ $v.tests.image.pullPolicy }}"
      {{- /* /info is the one endpoint that answers only when the REST layer is really
      up. -f turns an HTTP error status into a non-zero exit. */}}
      args:
        - -sSf
        - --max-time
        - "10"
        - http://{{ template "cp-ksql-server.fullname" . }}:{{ $v.service.port }}/info
      resources:
{{ toYaml $v.tests.resources | indent 8 }}
      {{- with $v.tests.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
