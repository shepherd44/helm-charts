{{- $v := include "cp-ksql-server.values" . | fromYaml -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "cp-ksql-server.fullname" . }}
  labels:
{{ include "cp-ksql-server.mergedLabels" (list . dict) | indent 4 }}
  {{- with (include "cp-ksql-server.mergedAnnotations" (list . dict)) }}
  annotations:
{{ . | indent 4 }}
  {{- end }}
spec:
  replicas: {{ $v.replicaCount }}
  {{- with $v.strategy }}
  strategy:
{{ toYaml . | indent 4 }}
  {{- end }}
  selector:
    matchLabels:
{{ include "cp-ksql-server.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "cp-ksql-server.mergedLabels" (list . $v.podLabels) | indent 8 }}
      {{- $podAnnotations := deepCopy ($v.podAnnotations | default dict) }}
      {{- if $v.metrics.enabled }}
      {{- $_ := set $podAnnotations "prometheus.io/scrape" "true" }}
      {{- $_ := set $podAnnotations "prometheus.io/port" ($v.metrics.port | toString) }}
      {{- end }}
      {{- with (include "cp-ksql-server.mergedAnnotations" (list . $podAnnotations)) }}
      annotations:
{{ . | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cp-ksql-server.serviceAccountName" . }}
      automountServiceAccountToken: {{ $v.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ $v.enableServiceLinks }}
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $v.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with $v.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ template "cp-ksql-server.name" . }}
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: "{{ $v.image.pullPolicy }}"
          {{- with $v.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: server
              containerPort: {{ $v.service.port }}
              protocol: TCP
            {{- if $v.metrics.enabled }}
            - containerPort: {{ $v.jmx.port }}
              name: jmx
            {{- end }}
          {{- with $v.livenessProbe }}
          livenessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $v.readinessProbe }}
          readinessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
{{ toYaml $v.resources | indent 12 }}
          {{- if or $v.ksql.headless $v.extraVolumeMounts }}
          volumeMounts:
          {{- if $v.ksql.headless }}
          - name: ksql-queries
            mountPath: /etc/ksql/queries
          {{- end }}
          {{- with $v.extraVolumeMounts }}
{{ toYaml . | indent 10 }}
          {{- end }}
          {{- end }}
          env:
          - name: KSQL_BOOTSTRAP_SERVERS
            value: {{ template "cp-ksql-server.kafka.bootstrapServers" . }}
          - name: KSQL_KSQL_SERVICE_ID
            value: {{ template "cp-ksql-server.serviceId" . }}
          - name: KSQL_KSQL_SCHEMA_REGISTRY_URL
            value: {{ template "cp-ksql-server.cp-schema-registry.service-name" . }}
          - name: KSQL_HEAP_OPTS
            value: "{{ $v.heapOptions }}"
          {{- if $v.ksql.headless }}
          - name: KSQL_KSQL_QUERIES_FILE
            value: /etc/ksql/queries/queries.sql
          {{- else }}
          - name: KSQL_KSQL_SINK_REPLICAS
            value: "{{ $v.ksql.sinkReplicas }}"
          - name: KSQL_KSQL_STREAMS_REPLICATION_FACTOR
            value: "{{ $v.ksql.streamsReplicationFactor }}"
          - name: KSQL_KSQL_INTERNAL_TOPIC_REPLICAS
            value: "{{ $v.ksql.internalTopicReplicas }}"
          - name: KSQL_LISTENERS
            value: http://0.0.0.0:{{ $v.service.port }}
          {{- end }}
          {{- range $key, $value := $v.configurationOverrides }}
          - name: {{ printf "KSQL_%s" $key | replace "." "_" | upper | quote }}
            value: {{ $value | quote }}
          {{- end }}
          {{- if $v.jmx.port }}
          - name: JMX_PORT
            value: "{{ $v.jmx.port }}"
          {{- end }}
          {{- with $v.extraEnv }}
{{ toYaml . | indent 10 }}
          {{- end }}
          {{- with $v.envFrom }}
          envFrom:
{{ toYaml . | indent 10 }}
          {{- end }}
        {{- if $v.metrics.enabled }}
        - name: prometheus-jmx-exporter
          image: "{{ $v.metrics.image.repository }}:{{ $v.metrics.image.tag }}"
          imagePullPolicy: "{{ $v.metrics.image.pullPolicy }}"
          command:
            - java
            - -XX:+UnlockExperimentalVMOptions
            - -XX:+UseCGroupMemoryLimitForHeap
            - -XX:MaxRAMFraction=1
            - -XshowSettings:vm
            - -jar
            - jmx_prometheus_httpserver.jar
            - {{ $v.metrics.port | quote }}
            - /etc/jmx-ksql-server/jmx-ksql-server-prometheus.yml
          ports:
            - containerPort: {{ $v.metrics.port }}
              name: {{ include "cp-ksql-server.metricsPortName" . }}
          resources:
{{ toYaml $v.metrics.resources | indent 12 }}
          {{- with $v.metrics.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: jmx-config
              mountPath: /etc/jmx-ksql-server
        {{- end }}
      {{- with $v.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if or $v.metrics.enabled $v.ksql.headless $v.extraVolumes }}
      volumes:
      {{- if $v.metrics.enabled }}
      - name: jmx-config
        configMap:
          name: {{ template "cp-ksql-server.fullname" . }}-jmx-configmap
      {{- end }}
      {{- if $v.ksql.headless }}
      - name: ksql-queries
        configMap:
          name: {{ template "cp-ksql-server.fullname" . }}-ksql-queries-configmap
      {{- end }}
      {{- with $v.extraVolumes }}
{{ toYaml . | indent 6 }}
      {{- end }}
      {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
      {{- end }}
