{{- $v := include "cp-schema-registry.values" . | fromYaml -}}
{{- if $v.metrics.prometheusRule.enabled }}
{{- $pr := $v.metrics.prometheusRule }}
{{- if not $pr.rules }}
{{- fail "metrics.prometheusRule.enabled is on but metrics.prometheusRule.rules is empty: the chart ships no default alerts, so this would create an empty rule group." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "cp-schema-registry.fullname" . }}
  namespace: {{ $pr.namespace | default .Release.Namespace }}
  labels:
{{ include "cp-schema-registry.mergedLabels" (list . $pr.labels) | indent 4 }}
  {{- with $pr.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ template "cp-schema-registry.fullname" . }}
      rules:
{{ toYaml $pr.rules | indent 8 }}
{{- end }}
