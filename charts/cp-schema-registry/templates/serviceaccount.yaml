{{- $v := include "cp-schema-registry.values" . | fromYaml -}}
{{- if $v.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cp-schema-registry.serviceAccountName" . }}
  labels:
{{ include "cp-schema-registry.mergedLabels" (list . $v.serviceAccount.labels) | indent 4 }}
  {{- with (include "cp-schema-registry.mergedAnnotations" (list . $v.serviceAccount.annotations)) }}
  annotations:
{{ . | indent 4 }}
  {{- end }}
{{- end }}
