{{- $v := include "cp-schema-registry.values" . | fromYaml -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "cp-schema-registry.fullname" . }}
  labels:
{{ include "cp-schema-registry.labels" . | indent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
{{ include "cp-schema-registry.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "cp-schema-registry.labels" . | indent 8 }}
      annotations:
        {{/* kubectl logs/exec 가 사이드카가 아니라 서버 컨테이너를 고르게 한다. */}}
        kubectl.kubernetes.io/default-container: {{ template "cp-schema-registry.name" . }}-server
      {{- range $key, $value := $v.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- if and $v.metrics.enabled $v.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $v.metrics.port | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cp-schema-registry.serviceAccountName" . }}
      {{- /* Schema Registry talks to Kafka, never to the Kubernetes API, so the token
      the default ServiceAccount would mount is a credential with no use here. */}}
      automountServiceAccountToken: {{ $v.serviceAccount.automountServiceAccountToken }}
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $v.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- $nativeExporter := and $v.metrics.enabled (eq $v.metrics.mode "native") }}
      {{- if or $v.initContainers $nativeExporter }}
      initContainers:
      {{- with $v.initContainers }}
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if $nativeExporter }}
{{ include "cp-schema-registry.exporterContainer" (list . true) | indent 8 }}
      {{- end }}
      {{- end }}
      securityContext:
      {{- if $v.podSecurityContext }}
{{ toYaml $v.podSecurityContext | indent 8 }}
      {{- end}}
      containers:
        - name: {{ template "cp-schema-registry.name" . }}-server
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: "{{ $v.image.pullPolicy }}"
          ports:
            - name: schema-registry
              containerPort: {{ $v.service.port }}
              protocol: TCP
            {{- /* JMX_PORT is set on the container whenever jmx.port is, so the JVM is
            listening either way; gating the declaration on the exporter only hid it
            from anyone attaching jconsole without running a second JVM. */}}
            {{- if $v.jmx.port }}
            - containerPort: {{ $v.jmx.port }}
              name: jmx
            {{- end }}
          {{- with $v.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $v.livenessProbe }}
          livenessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $v.readinessProbe }}
          readinessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
{{ toYaml $v.resources | indent 12 }}
          env:
          {{- $cfg := fromYaml (include "cp-schema-registry.config" .) }}
          {{- if not (hasKey $cfg "host.name") }}
          - name: SCHEMA_REGISTRY_HOST_NAME
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- end }}
          {{- with $v.heapOptions }}
          - name: SCHEMA_REGISTRY_HEAP_OPTS
            value: {{ . | quote }}
          {{- end }}
          {{- range $configName, $configValue := $cfg }}
          - name: SCHEMA_REGISTRY_{{ $configName | replace "." "_" | upper }}
            value: {{ $configValue | quote }}
          {{- end }}
          {{- range $key, $value := $v.customEnv }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
          {{- end }}
          {{- if $v.schemaRegistryOpts }}
          - name: SCHEMA_REGISTRY_OPTS
            value: "{{ $v.schemaRegistryOpts }}"
          {{- end }}
          {{- if $v.jmx.port }}
          - name: JMX_PORT
            value: "{{ $v.jmx.port }}"
          {{- end }}
          {{- /* Anything sensitive belongs here rather than in configurationOverrides,
          which renders values literally into the pod spec. */}}
          {{- with $v.envFrom }}
          envFrom:
{{ toYaml . | indent 10 }}
          {{- end }}
          {{- with $v.extraVolumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
          {{- end }}
        {{- if and $v.metrics.enabled (eq $v.metrics.mode "sidecar") }}
{{ include "cp-schema-registry.exporterContainer" (list . false) | indent 8 }}
        {{- end }}
        {{- with $v.extraContainers }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- if $v.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml $v.image.pullSecrets | indent 8 }}
      {{- end }}
      volumes:
      {{- if $v.metrics.enabled }}
      - name: jmx-config
        configMap:
          name: {{ template "cp-schema-registry.fullname" . }}-jmx-configmap
      {{- end }}
      {{- with $v.extraVolumes }}
{{ toYaml . | indent 6 }}
      {{- end }}
      {{- if $v.nodeSelector }}
      nodeSelector:
{{ toYaml $v.nodeSelector | indent 8 }}
      {{- end }}
      {{- if $v.tolerations }}
      tolerations:
{{ toYaml $v.tolerations | indent 8 }}
      {{- end }}
      {{- if $v.affinity }}
      affinity:
{{ toYaml $v.affinity | indent 8 }}
      {{- end }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
      {{- end }}
