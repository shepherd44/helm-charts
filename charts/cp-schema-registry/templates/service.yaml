{{- $v := include "cp-schema-registry.values" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "cp-schema-registry.fullname" . }}
  labels:
{{ include "cp-schema-registry.mergedLabels" (list . $v.service.labels) | indent 4 }}
  {{- with (include "cp-schema-registry.mergedAnnotations" (list . $v.service.annotations)) }}
  annotations:
{{ . | indent 4 }}
  {{- end }}
spec:
  ports:
    - name: schema-registry
      port: {{ $v.service.port }}
    {{- if $v.metrics.enabled }}
    - name: {{ include "cp-schema-registry.metricsPortName" . }}
      port: {{ $v.metrics.port }}
    {{- end }}
  selector:
{{ include "cp-schema-registry.selectorLabels" . | indent 4 }}
