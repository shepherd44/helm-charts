{{- $v := include "cp-schema-registry.values" . | fromYaml -}}
{{- if $v.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ template "cp-schema-registry.fullname" . }}-test-connection
  labels:
{{ include "cp-schema-registry.labels" . | indent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with $v.tests.image.pullSecrets }}
  imagePullSecrets:
{{ toYaml . | indent 4 }}
  {{- end }}
  containers:
    - name: test-connection
      image: "{{ $v.tests.image.repository }}:{{ $v.tests.image.tag }}"
      imagePullPolicy: "{{ $v.tests.image.pullPolicy }}"
      {{- /* /subjects needs the Kafka store to be readable, so this fails when the
      registry is up but its backing topic is not — which is the failure worth
      catching. -f turns an HTTP error status into a non-zero exit. */}}
      args:
        - -sSf
        - --max-time
        - "10"
        - http://{{ template "cp-schema-registry.fullname" . }}:{{ $v.service.port }}/subjects
      resources:
{{ toYaml $v.tests.resources | indent 8 }}
      {{- with $v.tests.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
