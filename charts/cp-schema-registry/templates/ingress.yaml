{{- if .Values.schema_registry.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.schema_registry.ingress.name | default (include "cp-schema-registry.fullname" .) }}
  labels:
{{ include "cp-schema-registry.labels" . | indent 4 }}
  {{- with .Values.schema_registry.ingress.labels }}
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with .Values.schema_registry.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with .Values.schema_registry.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.schema_registry.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
  {{- range .Values.schema_registry.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "cp-schema-registry.fullname" $ }}
                port:
                  number: {{ $.Values.schema_registry.servicePort }}
        {{- end }}
  {{- end }}
{{- end }}
