apiVersion: v2
name: cp-schema-registry
description: A Helm chart for Confluent Schema Registry on Kubernetes
type: application

## The floor is what the chart actually needs, not what upstream Kubernetes still
## supports: 1.22 went EOL in October 2022 and is kept here deliberately for legacy
## clusters. Everything the chart emits exists in 1.22 — apps/v1, networking.k8s.io/v1
## Ingress (GA 1.19), policy/v1 PodDisruptionBudget (GA 1.21), seccompProfile (GA 1.19).
## The -0 suffix makes pre-release cluster versions such as 1.22.0-alpha.3 compare
## correctly instead of sorting below 1.22.0.
kubeVersion: ">=1.22.0-0"
version: 1.2.0
appVersion: "7.9.9"
keywords:
  - kafka
  - schema-registry
  - confluent
home: https://github.com/shepherd44/helm-charts/tree/main/charts/cp-schema-registry
sources:
  - https://github.com/shepherd44/helm-charts/tree/main/charts/cp-schema-registry
maintainers:
  - name: shepherd44
    url: https://github.com/shepherd44

## Read by Artifact Hub and by anything else that indexes charts. `images` is
## documentation here — cp-schema-registry does not bundle the bitnami `common`
## library, so nothing enforces it — but it is what an installer reads to know what
## will be pulled, so it has to stay in step with values.yaml.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: cp-schema-registry
      image: confluentinc/cp-schema-registry:7.9.9
    - name: jmx-exporter
      image: shepherd9664/jmx-exporter:1.6.0-latest
    - name: test-connection
      image: curlimages/curl:8.11.1
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/shepherd44/helm-charts/tree/main/charts/cp-schema-registry
    - name: Changelog
      url: https://github.com/shepherd44/helm-charts/blob/main/charts/cp-schema-registry/CHANGELOG.md
    - name: Schema Registry version reference
      url: https://github.com/shepherd44/helm-charts/blob/main/charts/cp-schema-registry/docs/schema-registry-versions.md
  artifacthub.io/changes: |
    - kind: added
      description: topologySpreadConstraints pass-through
    - kind: added
      description: optional NetworkPolicy, ingress by default and egress opt-in
    - kind: added
      description: "metrics.mode: native runs the exporter as a Kubernetes sidecar container (needs k8s 1.29+)"
    - kind: added
      description: a Kubernetes version table in the README, saying what to use below 1.29 and 1.30
