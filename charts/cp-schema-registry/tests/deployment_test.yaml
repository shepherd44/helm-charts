suite: deployment
templates:
  - deployment.yaml
release:
  name: t
tests:
  - it: emits leader.eligibility, never the deprecated master.eligibility
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEMA_REGISTRY_LEADER_ELIGIBILITY
            value: "true"
      - notMatchRegexRaw:
          pattern: SCHEMA_REGISTRY_MASTER_ELIGIBILITY

  - it: stays out of the spelling when the user sets the deprecated key explicitly
    set:
      configurationOverrides:
        master.eligibility: "false"
    asserts:
      - notMatchRegexRaw:
          pattern: SCHEMA_REGISTRY_LEADER_ELIGIBILITY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEMA_REGISTRY_MASTER_ELIGIBILITY
            value: "false"

  - it: emits each config key exactly once when an override collides with a managed key
    set:
      configurationOverrides:
        kafkastore.group.id: mine
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEMA_REGISTRY_KAFKASTORE_GROUP_ID
            value: mine
          count: 1
          any: false

  - it: omits SCHEMA_REGISTRY_HEAP_OPTS unless heapOptions is set
    asserts:
      - notMatchRegexRaw:
          pattern: SCHEMA_REGISTRY_HEAP_OPTS

  - it: passes heapOptions through when set
    set:
      heapOptions: -Xms512M -Xmx512M
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEMA_REGISTRY_HEAP_OPTS
            value: -Xms512M -Xmx512M

  - it: runs only the server container by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: cp-schema-registry-server
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: cp-schema-registry-server

  - it: adds the exporter as a second container when enabled
    set:
      metrics.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: prometheus-jmx-exporter
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "5556"

  - it: runs as its own ServiceAccount and does not mount the API token
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: t-cp-schema-registry
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: falls back to the namespace default only when told not to create one
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: declares the JMX port whenever jmx.port is set, exporter or not
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 5555
            name: jmx

  - it: takes env from existing secrets and mounts extra volumes
    set:
      envFrom:
        - secretRef:
            name: sr-creds
      extraVolumes:
        - name: truststore
          secret:
            secretName: truststore
      extraVolumeMounts:
        - name: truststore
          mountPath: /etc/schema-registry/secrets
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: sr-creds
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: truststore
            mountPath: /etc/schema-registry/secrets
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: truststore
            secret:
              secretName: truststore

  - it: names the exporter port so a PodMonitor can reference it
    set:
      metrics.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].ports[0].name
          value: metrics
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: drops the scrape annotations when the operator CRDs are doing the discovery
    set:
      metrics.enabled: true
      metrics.scrapeAnnotations: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]

  - it: passes topology spread constraints through
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: runs the exporter as an ordinary container by default
    set:
      metrics.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - notExists:
          path: spec.template.spec.initContainers

  - it: moves the exporter to a native sidecar on request
    set:
      metrics.enabled: true
      metrics.mode: native
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prometheus-jmx-exporter
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].ports[0].name
          value: metrics

  - it: keeps the user's own init containers alongside a native exporter
    set:
      metrics.enabled: true
      metrics.mode: native
      initContainers:
        - name: wait-for-kafka
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-kafka
