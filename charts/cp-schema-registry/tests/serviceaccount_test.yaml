suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: t
tests:
  - it: is created by default, named after the release
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-cp-schema-registry

  - it: carries the annotations cloud identity needs
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sr
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/sr

  - it: is not created when an existing one is named
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0
