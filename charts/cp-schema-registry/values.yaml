# Default values for cp-schema-registry.
#
# Flattened in 1.0.0. Everything used to sit under a `schema_registry:` key; the old
# shape still works, in full, and is documented at the bottom of this file — but it is
# deprecated and the chart warns about it at install time.

## Number of Schema Registry pods.
replicaCount: 1

## ref: https://hub.docker.com/r/confluentinc/cp-schema-registry/
image:
  repository: confluentinc/cp-schema-registry
  tag: "7.9.9"
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  pullPolicy: IfNotPresent
  ## Secrets must already exist in the namespace.
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  pullSecrets: []

## Whether this instance may be elected the writer (`leader.eligibility`).
## Until 0.5.0 the chart hardcoded the deprecated spelling, master.eligibility.
leaderEligibility: true

## Schema Registry settings overrides.
## Configuration Options: https://docs.confluent.io/platform/current/schema-registry/installation/config.html
##
## Keys here become SCHEMA_REGISTRY_<KEY_WITH_UNDERSCORES>, uppercased, and take
## precedence over the keys the chart sets itself (listeners,
## kafkastore.bootstrap.servers, kafkastore.group.id, leader.eligibility, host.name).
##
## Values are rendered literally into the Deployment, so anything secret belongs in
## `envFrom` instead — see below.
configurationOverrides: {}

## Additional env variables.
customEnv: {}

## Extra JVM options, passed as SCHEMA_REGISTRY_OPTS. Distinct from heapOptions,
## which is SCHEMA_REGISTRY_HEAP_OPTS.
schemaRegistryOpts: ""

## Schema Registry JVM heap options, passed as SCHEMA_REGISTRY_HEAP_OPTS.
## Empty by default so the JVM keeps its own container-aware sizing; this used
## to default to "-Xms512M -Xmx512M" while the template ignored it entirely, so
## defaulting it back on would silently change the heap of running releases.
## Set it together with resources.limits.memory, not on its own.
heapOptions: ""

service:
  ## The port on which Schema Registry serves its REST API.
  port: 8081

## You can list a load balanced service endpoint, or a list of all brokers (which is
## hard in Kubernetes). e.g.:
## bootstrapServers: "PLAINTEXT://dozing-prawn-kafka-headless:9092"
## The chart uses Kafka coordinator leader election:
## https://docs.confluent.io/current/schema-registry/docs/design.html#kafka-coordinator-master-election
kafka:
  bootstrapServers: ""

## Probes. Set either to {} to omit it.
## `/subjects` needs the Kafka store to be readable, which is what readiness
## should mean here; `/` only needs Jetty, which is what liveness should mean.
livenessProbe:
  httpGet:
    path: /
    port: schema-registry
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /subjects
    port: schema-registry
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## Custom pod annotations.
podAnnotations: {}

## ServiceAccount for the pods.
## automountServiceAccountToken is false because Schema Registry talks to Kafka and
## never to the Kubernetes API — the token is a credential nothing here uses. Set
## `create: false` with an empty `name` to go back to the namespace default.
## `annotations` is where cloud identity goes (EKS IRSA, GKE Workload Identity).
serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false

## Env from existing Secrets or ConfigMaps. Use this for anything sensitive —
## kafkastore.sasl.jaas.config, truststore and keystore passwords — because
## configurationOverrides renders its values literally into the Deployment, where
## `kubectl get deploy -o yaml` and every GitOps diff can read them.
## Keys must already be spelled the way Schema Registry expects, e.g.
## SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG.
envFrom: []
  # - secretRef:
  #     name: schema-registry-kafka-credentials

## Extra volumes and mounts on the server container. A JKS truststore or keystore
## comes in this way; the container mounts nothing by default.
extraVolumes: []
  # - name: kafka-truststore
  #   secret:
  #     secretName: kafka-truststore
extraVolumeMounts: []
  # - name: kafka-truststore
  #   mountPath: /etc/schema-registry/secrets
  #   readOnly: true

## Pass-throughs. Empty by default, so they change nothing until set.
initContainers: []
extraContainers: []
priorityClassName: ""
## Time to finish in-flight requests during a rolling update. Unset means the
## Kubernetes default of 30s.
terminationGracePeriodSeconds: null

## Ingress for the Schema Registry REST API (service.port).
## `name` defaults to the chart fullname; set it to adopt an Ingress that
## already exists under a different name.
ingress:
  enabled: false
  name: ""
  className: ""
  labels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts: []
    # - host: schema-registry.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: schema-registry-tls
    #   hosts:
    #     - schema-registry.example.com

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

## Pod-level security context. Was `securityContext` before 1.0.0, renamed so it
## cannot be confused with the container-level one below.
## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

## Container-level security context for the Schema Registry container.
## readOnlyRootFilesystem is deliberately not set: the Confluent image writes
## its generated config and logs under the container filesystem.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

## Disabled by default: with replicaCount 1 a budget of minAvailable 1 blocks
## node drains outright. Enable it alongside replicaCount >= 2.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

## `helm test` hook. Runs only on `helm test`, never on install or upgrade.
## The image needs nothing but curl; the entrypoint is already curl, so the
## template passes args only.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
    pullSecrets: []
  resources: {}
  ## runAsUser has to be numeric: curlimages/curl declares USER curl_user, and a
  ## kubelet cannot verify a *named* user against runAsNonRoot — it refuses to start
  ## the container with CreateContainerConfigError instead. 100 is curl_user's uid.
  ## Change it together with `image` if you point this at a mirror.
  securityContext:
    runAsUser: 100
    runAsGroup: 100
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

## Schema Registry JMX settings. The port is declared on the container whenever it is
## set, with or without the exporter below, so jconsole can reach it.
## ref: https://docs.confluent.io/current/schema-registry/docs/monitoring.html
jmx:
  port: 5555

## JMX exporter sidecar. Was `prometheus.jmx` before 1.0.0.
## ref: https://github.com/prometheus/jmx_exporter
metrics:
  ## Opt-in. The sidecar is a second JVM in every pod and this chart ships no
  ## ServiceMonitor/PodMonitor — it only sets prometheus.io/scrape annotations,
  ## which a Prometheus Operator setup ignores. Turn it on only once something
  ## is actually configured to scrape the exporter port.
  enabled: false
  ## Built from https://github.com/shepherd44/containers (jmx_prometheus_standalone).
  ## The image's entrypoint is the jar, so the deployment passes only args.
  ## Swapping this for another image means matching that contract.
  image:
    repository: shepherd9664/jmx-exporter
    tag: 1.6.0-latest
    pullPolicy: IfNotPresent
  port: 5556

  resources: {}

  ## Privilege and access control settings for a Pod or Container
  ## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true

## ------------------------------------------------------------------------------
## Deprecated: the pre-1.0.0 layout.
##
## Anything set here is mapped onto the keys above and still works. It wins key by
## key: a setting here overrides the same setting in the new shape, and a setting it
## leaves out falls through — so a values file can be migrated a piece at a time.
## NOTES.txt warns whenever this block is in use.
##
##   schema_registry:
##     image: confluentinc/cp-schema-registry   -> image.repository
##     imageTag: "7.9.9"                        -> image.tag
##     imagePullPolicy: IfNotPresent            -> image.pullPolicy
##     imagePullSecrets: []                     -> image.pullSecrets
##     servicePort: 8081                        -> service.port
##     securityContext: {}                      -> podSecurityContext
##     prometheus:
##       jmx:
##         enabled: false                       -> metrics.enabled
##         image: shepherd9664/jmx-exporter     -> metrics.image.repository
##         imageTag: 1.6.0-latest               -> metrics.image.tag
##         imagePullPolicy: IfNotPresent        -> metrics.image.pullPolicy
##         port: 5556                           -> metrics.port
##         resources: {}                        -> metrics.resources
##         securityContext: {}                  -> metrics.securityContext
##
## Every other key keeps its name: schema_registry.replicaCount -> replicaCount, and
## so on for the whole file.
## ------------------------------------------------------------------------------
schema_registry: {}
