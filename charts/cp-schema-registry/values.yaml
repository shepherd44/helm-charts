# Default values for cp-schema-registry.
#
# Flattened in 1.0.0. Everything used to sit under a `schema_registry:` key; the old
# shape still works, in full, and is documented at the bottom of this file — but it is
# deprecated and the chart warns about it at install time.

## Number of Schema Registry pods.
replicaCount: 1

## ref: https://hub.docker.com/r/confluentinc/cp-schema-registry/
image:
  repository: confluentinc/cp-schema-registry
  tag: "7.9.9"
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  pullPolicy: IfNotPresent
  ## Secrets must already exist in the namespace.
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  pullSecrets: []

## Whether this instance may be elected the writer (`leader.eligibility`).
## Until 0.5.0 the chart hardcoded the deprecated spelling, master.eligibility.
leaderEligibility: true

## Schema Registry settings overrides.
## Configuration Options: https://docs.confluent.io/platform/current/schema-registry/installation/config.html
##
## Keys here become SCHEMA_REGISTRY_<KEY_WITH_UNDERSCORES>, uppercased, and take
## precedence over the keys the chart sets itself (listeners,
## kafkastore.bootstrap.servers, kafkastore.group.id, leader.eligibility, host.name).
##
## Values are rendered literally into the Deployment, so anything secret belongs in
## `envFrom` instead — see below.
configurationOverrides: {}

## Additional env variables.
customEnv: {}

## Extra JVM options, passed as SCHEMA_REGISTRY_OPTS. Distinct from heapOptions,
## which is SCHEMA_REGISTRY_HEAP_OPTS.
schemaRegistryOpts: ""

## Schema Registry JVM heap options, passed as SCHEMA_REGISTRY_HEAP_OPTS.
## Empty by default so the JVM keeps its own container-aware sizing; this used
## to default to "-Xms512M -Xmx512M" while the template ignored it entirely, so
## defaulting it back on would silently change the heap of running releases.
## Set it together with resources.limits.memory, not on its own.
heapOptions: ""

service:
  ## The port on which Schema Registry serves its REST API.
  port: 8081

## You can list a load balanced service endpoint, or a list of all brokers (which is
## hard in Kubernetes). e.g.:
## bootstrapServers: "PLAINTEXT://dozing-prawn-kafka-headless:9092"
## The chart uses Kafka coordinator leader election:
## https://docs.confluent.io/current/schema-registry/docs/design.html#kafka-coordinator-master-election
kafka:
  bootstrapServers: ""

## Probes. Set either to {} to omit it.
## `/subjects` needs the Kafka store to be readable, which is what readiness
## should mean here; `/` only needs Jetty, which is what liveness should mean.
livenessProbe:
  httpGet:
    path: /
    port: schema-registry
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /subjects
    port: schema-registry
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## Custom pod annotations.
podAnnotations: {}

## ServiceAccount for the pods.
## automountServiceAccountToken is false because Schema Registry talks to Kafka and
## never to the Kubernetes API — the token is a credential nothing here uses. Set
## `create: false` with an empty `name` to go back to the namespace default.
## `annotations` is where cloud identity goes (EKS IRSA, GKE Workload Identity).
serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false

## Env from existing Secrets or ConfigMaps. Use this for anything sensitive —
## kafkastore.sasl.jaas.config, truststore and keystore passwords — because
## configurationOverrides renders its values literally into the Deployment, where
## `kubectl get deploy -o yaml` and every GitOps diff can read them.
## Keys must already be spelled the way Schema Registry expects, e.g.
## SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG.
envFrom: []
  # - secretRef:
  #     name: schema-registry-kafka-credentials

## Extra volumes and mounts on the server container. A JKS truststore or keystore
## comes in this way; the container mounts nothing by default.
extraVolumes: []
  # - name: kafka-truststore
  #   secret:
  #     secretName: kafka-truststore
extraVolumeMounts: []
  # - name: kafka-truststore
  #   mountPath: /etc/schema-registry/secrets
  #   readOnly: true

## Pass-throughs. Empty by default, so they change nothing until set.
initContainers: []
extraContainers: []
priorityClassName: ""
## Time to finish in-flight requests during a rolling update. Unset means the
## Kubernetes default of 30s.
terminationGracePeriodSeconds: null

## Ingress for the Schema Registry REST API (service.port).
## `name` defaults to the chart fullname; set it to adopt an Ingress that
## already exists under a different name.
ingress:
  enabled: false
  name: ""
  className: ""
  labels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts: []
    # - host: schema-registry.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: schema-registry-tls
    #   hosts:
    #     - schema-registry.example.com

## HTTPRoute, for clusters running a Gateway API controller. Independent of `ingress`
## above rather than an either/or switch: during a migration people genuinely run both,
## and independent flags mean retiring one later is not a breaking change.
##
## Needs the Gateway API CRDs installed (v1 needs Kubernetes >= 1.25) and a controller
## that implements them. The chart renders the object anywhere — nothing is auto-detected,
## because rendering must not depend on which cluster the client happens to point at.
##
## `parentRefs` is required: an HTTPRoute with no parent attaches to no Gateway and
## silently routes nothing, so the chart fails instead.
httpRoute:
  enabled: false
  name: ""
  labels: {}
  annotations: {}
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  hostnames: []
    # - schema-registry.example.com
  ## Left empty, the chart routes every path to its own Service. Set this to take
  ## over completely — matches, filters, timeouts, weighted backends.
  rules: []
    # - matches:
    #     - path:
    #         type: PathPrefix
    #         value: /subjects
    #   backendRefs:
    #     - name: my-release-cp-schema-registry
    #       port: 8081

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

## Spread replicas across zones or nodes. Pure pass-through, empty by default.
## The field itself is GA since Kubernetes 1.19, so it works on this chart's 1.22
## floor — but minDomains, matchLabelKeys, nodeAffinityPolicy and nodeTaintsPolicy
## inside it are newer (1.27-1.30). See "Kubernetes versions" in the README.
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app: cp-schema-registry
  #       release: my-release

## NetworkPolicy. Off by default, because a policy that is wrong is worse than none:
## it takes the release down and looks like a Schema Registry fault.
##
## Enabling it writes an *ingress* policy only. That already helps — everything except
## the ports below is closed — and it cannot break the pod's own outbound traffic.
## Egress is opt-in on top, because the chart cannot infer where Kafka is:
## `kafka.bootstrapServers` is a hostname string, not a selector or a CIDR.
networkPolicy:
  enabled: false
  ingress:
    ## Who may reach the REST API, and the exporter port when metrics.enabled.
    ## Empty means any pod in the cluster — still narrower than no policy, since
    ## every other port is closed.
    from: []
      # - namespaceSelector:
      #     matchLabels:
      #       kubernetes.io/metadata.name: my-apps
      # - podSelector:
      #     matchLabels:
      #       app.kubernetes.io/name: my-producer
    ## Extra ingress rules, passed through as written.
    extraRules: []
  egress:
    ## Opt-in. Turning this on adds Egress to policyTypes, which denies every
    ## outbound connection the rules below do not allow — including Kafka.
    enabled: false
    ## UDP and TCP 53 to anywhere. Forgetting DNS is the classic way to break a
    ## release with an egress policy.
    allowDNS: true
    ## Egress rules, passed through as written. Kafka goes here.
    rules: []
      # - to:
      #     - podSelector:
      #         matchLabels:
      #           app.kubernetes.io/name: kafka
      #   ports:
      #     - port: 9092
      #       protocol: TCP

## Pod-level security context. Was `securityContext` before 1.0.0, renamed so it
## cannot be confused with the container-level one below.
## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

## Container-level security context for the Schema Registry container.
## readOnlyRootFilesystem is deliberately not set: the Confluent image writes
## its generated config and logs under the container filesystem.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

## Disabled by default: with replicaCount 1 a budget of minAvailable 1 blocks
## node drains outright. Enable it alongside replicaCount >= 2.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

## `helm test` hook. Runs only on `helm test`, never on install or upgrade.
## The image needs nothing but curl; the entrypoint is already curl, so the
## template passes args only.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
    pullSecrets: []
  resources: {}
  ## runAsUser has to be numeric: curlimages/curl declares USER curl_user, and a
  ## kubelet cannot verify a *named* user against runAsNonRoot — it refuses to start
  ## the container with CreateContainerConfigError instead. 100 is curl_user's uid.
  ## Change it together with `image` if you point this at a mirror.
  securityContext:
    runAsUser: 100
    runAsGroup: 100
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

## Schema Registry JMX settings. The port is declared on the container whenever it is
## set, with or without the exporter below, so jconsole can reach it.
## ref: https://docs.confluent.io/current/schema-registry/docs/monitoring.html
jmx:
  port: 5555

## JMX exporter sidecar. Was `prometheus.jmx` before 1.0.0.
## ref: https://github.com/prometheus/jmx_exporter
metrics:
  ## Opt-in. The sidecar is a second JVM in every pod and this chart ships no
  ## ServiceMonitor/PodMonitor — it only sets prometheus.io/scrape annotations,
  ## which a Prometheus Operator setup ignores. Turn it on only once something
  ## is actually configured to scrape the exporter port.
  enabled: false
  ## How the exporter runs alongside Schema Registry.
  ##
  ##   sidecar  an ordinary container. Works on every supported Kubernetes, including
  ##            this chart's 1.22 floor. No ordering guarantee: the exporter can start
  ##            before JMX is listening and log connection errors, and on shutdown it
  ##            can outlive or predecease the thing it scrapes.
  ##   native   an init container with restartPolicy: Always — a Kubernetes sidecar
  ##            container, started before the main container and stopped after it.
  ##            Needs Kubernetes >= 1.29 (beta) / 1.33 (GA).
  ##
  ## Do not set `native` below 1.29: the API server drops the unknown restartPolicy
  ## field, the exporter becomes an ordinary init container that never exits, and the
  ## pod never starts. That failure is silent, which is why this is a value and not
  ## something the chart guesses from the cluster.
  mode: sidecar

  ## Built from https://github.com/shepherd44/containers (jmx_prometheus_standalone).
  ## The image's entrypoint is the jar, so the deployment passes only args.
  ## Swapping this for another image means matching that contract.
  image:
    repository: shepherd9664/jmx-exporter
    tag: 1.6.0-latest
    pullPolicy: IfNotPresent
  port: 5556

  resources: {}

  ## Privilege and access control settings for a Pod or Container
  ## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true

  ## prometheus.io/scrape and prometheus.io/port on the pod. These only work for a
  ## Prometheus configured with kubernetes_sd_configs and relabeling; an Operator
  ## install ignores them and reads the CRDs below instead. Left on so existing
  ## setups keep working — turn it off when using serviceMonitor or podMonitor, so
  ## the same target is not also discovered by annotation.
  scrapeAnnotations: true

  ## ServiceMonitor for the Prometheus Operator. Scrapes the exporter port through
  ## the chart's Service, which is the usual choice: it follows the endpoints, so it
  ## survives replica changes.
  ##
  ## `labels` almost always has to carry whatever the Prometheus resource selects on
  ## — with kube-prometheus-stack that is `release: <stack release name>`. Without it
  ## the object is created and quietly never scraped.
  ##
  ## Requires `metrics.enabled`: there is nothing listening otherwise, and the chart
  ## fails rather than rendering a monitor pointed at a port that does not exist.
  serviceMonitor:
    enabled: false
    ## Defaults to the release namespace.
    namespace: ""
    labels: {}
    annotations: {}
    jobLabel: ""
    ## Empty means the Prometheus global default.
    interval: ""
    scrapeTimeout: ""
    path: /metrics
    scheme: http
    honorLabels: false
    ## Extra matchLabels, ANDed with the chart's own selector.
    selector: {}
    relabelings: []
    metricRelabelings: []

  ## PodMonitor. The alternative to serviceMonitor, for scraping pods directly rather
  ## than through the Service. Enabling both is an error — the same target would be
  ## scraped twice under two job names.
  podMonitor:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    jobLabel: ""
    interval: ""
    scrapeTimeout: ""
    path: /metrics
    scheme: http
    honorLabels: false
    selector: {}
    relabelings: []
    metricRelabelings: []

  ## PrometheusRule. No rules are shipped: what is worth alerting on depends on the
  ## deployment, and a chart that ships opinionated alerts tends to ship noise.
  ## `rules` goes into a single group named after the release.
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    rules: []
      # - alert: SchemaRegistryDown
      #   expr: up{job="my-release-cp-schema-registry"} == 0
      #   for: 5m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: Schema Registry is not being scraped

## ------------------------------------------------------------------------------
## Deprecated: the pre-1.0.0 layout.
##
## Anything set here is mapped onto the keys above and still works. It wins key by
## key: a setting here overrides the same setting in the new shape, and a setting it
## leaves out falls through — so a values file can be migrated a piece at a time.
## NOTES.txt warns whenever this block is in use.
##
##   schema_registry:
##     image: confluentinc/cp-schema-registry   -> image.repository
##     imageTag: "7.9.9"                        -> image.tag
##     imagePullPolicy: IfNotPresent            -> image.pullPolicy
##     imagePullSecrets: []                     -> image.pullSecrets
##     servicePort: 8081                        -> service.port
##     securityContext: {}                      -> podSecurityContext
##     prometheus:
##       jmx:
##         enabled: false                       -> metrics.enabled
##         image: shepherd9664/jmx-exporter     -> metrics.image.repository
##         imageTag: 1.6.0-latest               -> metrics.image.tag
##         imagePullPolicy: IfNotPresent        -> metrics.image.pullPolicy
##         port: 5556                           -> metrics.port
##         resources: {}                        -> metrics.resources
##         securityContext: {}                  -> metrics.securityContext
##
## Every other key keeps its name: schema_registry.replicaCount -> replicaCount, and
## so on for the whole file.
## ------------------------------------------------------------------------------
schema_registry: {}
